name: Release

# Releases ONLY by a manual dispatch (as ReflectorNet / McpPlugin). Merging a version bump to `main` publishes nothing.
# Order: guard -> pack + package check (scripts/pack.sh) + version checks -> every runtime's tests + conformance -> NuGet
# publish (Trusted Publishing) -> verify the version is live on NuGet -> tag nuget-v<version> + GitHub Release. The tag is
# created only after the package is live, so a re-dispatch of the same commit after a failed publish / verify is always
# possible (--skip-duplicate); a version already live from another commit fails the run.
#
#   gh workflow run release.yml -R IvanMurzak/RQL --ref main -f dry_run=true
#   gh workflow run release.yml -R IvanMurzak/RQL --ref main -f dry_run=false
#
# NuGet Trusted Publishing: nuget.org account IvanMurzak needs a policy for repository IvanMurzak/RQL, workflow
# release.yml. Package com.IvanMurzak.Rql (dotnet/Rql.Package); version = <Version> in dotnet/Directory.Build.props.
# Tags are prefixed (nuget-v…): the TypeScript and Unity packages of this repo version independently.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every test and the pack, publish NOTHING (no NuGet push, no tag, no GitHub Release)."
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Optional markdown appended to the GitHub Release body."
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false   # never cancel running self-hosted jobs (it can wedge the runner)

permissions:
  contents: read

env:
  # Linux host: runner-manager's sandboxed runners are root without CAP_CHOWN, so tool archives must not restore
  # owners (GNU tar reads TAR_OPTIONS; macOS bsdtar ignores it).
  TAR_OPTIONS: --no-same-owner
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_ID: com.IvanMurzak.Rql

jobs:
  test-and-pack:
    runs-on: [self-hosted]
    timeout-minutes: 40
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Ref guard
        if: inputs.dry_run != true && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::A real release must be dispatched on refs/heads/main (got '$REF'). Use dry_run=true on other refs."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pack and the version checks run first so a forgotten version bump fails in minutes, not after the full suite.
      - name: Pack + check the package
        id: pack
        run: |
          version=$(scripts/pack.sh ./packages)   # fails the step when the pack or the package check fails
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag must not exist; a version already on NuGet must come from this commit
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          fail() { if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1 (a real run would fail here)."; else echo "::error::$1"; exit 1; fi; }
          bump="bump <Version> in dotnet/Directory.Build.props on main, then dispatch again"
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/nuget-v$VERSION" >/dev/null || rc=$?
          case $rc in
            0) fail "Tag nuget-v$VERSION already exists: $bump" ;;
            2) ;;   # no such tag
            *) echo "::error::git ls-remote failed (exit $rc)"; exit 1 ;;
          esac
          # publish uses --skip-duplicate (re-dispatch after a failed verify / tag). That is safe only when the live
          # package was built from this very commit; otherwise the tag + Release would not match what NuGet serves.
          # tr, not ${x,,}: macOS bash is 3.2.
          id=$(printf %s "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]'); v=$(printf %s "$VERSION" | tr '[:upper:]' '[:lower:]'); nuspec="$RUNNER_TEMP/live.nuspec"
          code=$(curl -sS -o "$nuspec" -w '%{http_code}' --max-time 30 "https://api.nuget.org/v3-flatcontainer/$id/$v/$id.nuspec")
          case $code in
            404) ;;   # not published yet
            200) grep -qF "commit=\"$GITHUB_SHA\"" "$nuspec" || fail "$PACKAGE_ID $VERSION is already on NuGet from another commit: $bump" ;;
            *) echo "::error::NuGet lookup failed (HTTP $code)"; exit 1 ;;
          esac
      # A full run before publishing is a deliberate gate, even when ci.yml already passed this commit.
      - name: Test all runtimes + conformance (no LLM)
        run: scripts/test-all.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./packages/*.nupkg
          if-no-files-found: error

  publish:
    needs: test-and-pack
    if: inputs.dry_run != true
    runs-on: [self-hosted]
    timeout-minutes: 30
    permissions:
      id-token: write   # NuGet Trusted Publishing (OIDC); no API key is stored anywhere
      contents: write   # tag + GitHub Release, after the package is verified live
    env:
      VERSION: ${{ needs.test-and-pack.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: ./packages
      - name: Login to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: IvanMurzak
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./packages/$PACKAGE_ID.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Verify the version is live on NuGet
        run: |
          # The flat container lists ids and versions lowercased; match the version literally (dots are not wildcards).
          for i in $(seq 1 60); do
            if curl -fsS --max-time 20 "https://api.nuget.org/v3-flatcontainer/$(printf %s "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')/index.json" | grep -qF "\"$(printf %s "$VERSION" | tr '[:upper:]' '[:lower:]')\""; then
              echo "$PACKAGE_ID $VERSION is live"; exit 0
            fi
            sleep 20
          done
          echo "::error::$PACKAGE_ID $VERSION did not appear on NuGet within 20 minutes"; exit 1
      - name: Tag + GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nuget-v${{ env.VERSION }}
          name: RQL ${{ env.VERSION }} (NuGet)
          target_commitish: ${{ github.sha }}
          files: ./packages/*.nupkg
          body: |
            NuGet: https://www.nuget.org/packages/${{ env.PACKAGE_ID }}/${{ env.VERSION }}

            ${{ inputs.release_notes }}
