name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # never cancel running self-hosted jobs (it can wedge the runner)

jobs:
  # A fork PR skips test-all (below), and a skipped job reports success: fail here instead so a fork PR
  # never looks green untested. A maintainer re-runs its code on a same-repo branch.
  fork-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "::error::PRs from forks are not tested here; push the change to a branch of this repo." && exit 1

  test-all:
    # Ephemeral Linux runners spawned by runner-manager in WSL2 (Ubuntu-24.04) on ANASTASIIA.
    # runner-manager answers a job only when EVERY runs-on label is one of the policy's routing labels
    # (the policy carries rm-anastasiia-wsl-linux-x64, linux, self-hosted); the selector keeps other runners away.
    # Fork PRs skip cleanly here. This is NOT the security boundary (a fork PR runs its own copy of this file):
    # the repo setting "Require approval for all external contributors" is what keeps fork code off this host
    # (settable only once the repo is public: set it right after the visibility flip).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, rm-anastasiia-wsl-linux-x64]
    timeout-minutes: 30
    env:
      # runner-manager's sandboxed runners are root without CAP_CHOWN: tool archives must not restore owners.
      TAR_OPTIONS: --no-same-owner
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Toolchain versions
        run: dotnet --list-sdks && node --version && cmake --version | head -1 && c++ --version | head -1
      - name: Test all runtimes + conformance + task self-check (no LLM)
        run: scripts/test-all.sh
      - name: Pack com.IvanMurzak.Rql and check the package
        run: scripts/pack.sh ./packages
