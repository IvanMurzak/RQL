<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="RQL architecture: text is parsed into a canonical QueryPlan that .NET, TypeScript and C++ executors run against live objects"><title>RQL architecture: text is parsed into a canonical QueryPlan that .NET, TypeScript and C++ executors run against live objects</title><style>
